            campusSection.appendChild(label);
        });
        filtersDiv.appendChild(campusSection);
        
        
        const section = document.createElement('div');
        section.className = 'filter-section';
        section.innerHTML = `<div class="filter-title">Location Type</div>`;
        uniqueTypes.forEach(type => {
            const color = colorScale(type);
            const label = document.createElement('label');
            label.innerHTML = `<input type="checkbox" value="${type}" checked> <span class="color-key" style="background: ${color};"></span> ${type}`;
            section.appendChild(label);
        });
        filtersDiv.appendChild(section);

        let hoverNode = null;
        
        // Pre-compute neighbors
        rawData.nodes.forEach(node => {
            node.neighbors = new Set();
        });
        rawData.links.forEach(link => {
            const a = rawData.nodes.find(n => n.id === link.source);
            const b = rawData.nodes.find(n => n.id === link.target);
            if (a && b) {
                a.neighbors.add(b.id);
                b.neighbors.add(a.id);
            }
        });
        
        // Layout anchor nodes in a large circle
        const entityNodes = rawData.nodes.filter(n => n.nodeType === 'entity');
        const radius = 600;
        entityNodes.forEach((node, i) => {
            const angle = (i / entityNodes.length) * 2 * Math.PI;
            node.fx = radius * Math.cos(angle);
            node.fy = radius * Math.sin(angle);
        });
        
        const Graph = ForceGraph()(document.getElementById('graph'))
            .nodeId('id')
            .nodeLabel('name')
            .nodeColor('color')
            .nodeVal(node => Math.sqrt(node.val) * (node.nodeType === 'entity' ? 2 : 0.5) + (node.nodeType === 'entity' ? 8 : 2))
            .nodeCanvasObject((node, ctx, globalScale) => {
                const isEntity = node.nodeType === 'entity';
                const isHovered = hoverNode && (node.id === hoverNode.id || hoverNode.neighbors.has(node.id));
                
                if (hoverNode && !isHovered) {
                    ctx.globalAlpha = isEntity ? 0.3 : 0.1;
                } else {
                    ctx.globalAlpha = 1;
                }
                
                const size = Math.sqrt(node.val) * (isEntity ? 2 : 0.5) + (isEntity ? 10 : 2);
                ctx.beginPath();
                ctx.arc(node.x, node.y, size, 0, 2 * Math.PI, false);
                ctx.fillStyle = node.color || '#ffffff';
                ctx.fill();
                if (node.role && node.role !== 'Regular' && node.nodeType !== 'entity') {
                    ctx.lineWidth = size * 0.3;
                    if (node.role === 'Elder') ctx.strokeStyle = '#ffd700';
                    else if (node.role === 'Staff') ctx.strokeStyle = '#a371f7';
                    else if (node.role === 'Member') ctx.strokeStyle = '#3fb950';
                    ctx.stroke();
                }


                if (isEntity || globalScale >= 1.5 || (hoverNode && isHovered)) {
                    const fontSize = isEntity ? (16 / globalScale) : (12 / globalScale);
                    ctx.font = `${isEntity ? 'bold ' : ''}${fontSize}px Sans-Serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = isEntity ? 'middle' : 'top';
                    ctx.fillStyle = isEntity ? '#161b22' : 'rgba(255, 255, 255, 0.9)';
                    
                    if (isEntity) {
                        ctx.fillText(node.name, node.x, node.y);
                    } else {
                        ctx.fillText(node.name, node.x, node.y + size + (2 / globalScale));
                    }
                }
                
                if (node.fx !== undefined && !isEntity) {
                    ctx.beginPath();
                    ctx.arc(node.x, node.y, size * 0.4, 0, 2 * Math.PI, false);
                    ctx.fillStyle = 'black';
                    ctx.fill();
                if (node.role && node.role !== 'Regular' && node.nodeType !== 'entity') {
                    ctx.lineWidth = size * 0.3;
                    if (node.role === 'Elder') ctx.strokeStyle = '#ffd700';
                    else if (node.role === 'Staff') ctx.strokeStyle = '#a371f7';
                    else if (node.role === 'Member') ctx.strokeStyle = '#3fb950';
                    ctx.stroke();
                }

                }
                
                ctx.globalAlpha = 1; // Reset alpha
            })
            .onNodeHover(node => {
                hoverNode = node || null;
                Graph.nodeCanvasObject(Graph.nodeCanvasObject())
                     .linkColor(Graph.linkColor());
                document.getElementById('graph').style.cursor = node ? 'pointer' : null;
                
                const panel = document.getElementById('details-panel');
                if (node && node.nodeType === 'person') {
                    panel.style.display = 'block';
                    document.getElementById('details-name').innerText = node.name;
                    document.getElementById('details-campus').innerText = node.group;
                    
                    const connections = {};
                    rawData.links.forEach(l => {
                        const sId = typeof l.source === 'object' ? l.source.id : l.source;
                        const tId = typeof l.target === 'object' ? l.target.id : l.target;
                        if (sId === node.id || tId === node.id) {
                            if (!connections[l.type]) connections[l.type] = 0;
                            connections[l.type] += l.weight;
                        }
                    });
                    
                    const sortedConnections = Object.entries(connections).sort((a, b) => b[1] - a[1]);
                    
                    let contentHtml = '<div style="font-size:13px;"><strong>Connections by Activity:</strong><br/>';
                    if (sortedConnections.length === 0) {
                        contentHtml += '<div style="color:#8b949e; margin-top:5px;">No active connections.</div>';
                    } else {
                        contentHtml += '<table style="width:100%; margin-top:8px; border-collapse: collapse;">';
                        sortedConnections.forEach(([type, count]) => {
                            const cleanType = type.substring(type.indexOf(':')+1).trim() || type;
                            const color = colorScale(type);
                            contentHtml += `<tr>
                                <td style="padding:3px 0; border-bottom: 1px solid #30363d;"><span class="color-key" style="background: ${color};"></span> ${cleanType}</td>
                                <td style="padding:3px 0; border-bottom: 1px solid #30363d; text-align:right; font-weight:bold;">${count}</td>
                            </tr>`;
                        });
                        contentHtml += '</table>';
                    }
                    contentHtml += '</div>';
                    
                    document.getElementById('details-content').innerHTML = contentHtml;
                } else if (node && node.nodeType === 'entity') {
                    panel.style.display = 'none'; // hide panel for entity nodes
                }
            })
            .onNodeDragEnd(node => {
                // Pin node to the dragged position
                node.fx = node.x;
                node.fy = node.y;
            })
            .onNodeClick(node => {
                // Unpin node on click
                node.fx = undefined;
                node.fy = undefined;
            })
            .linkSource('source')
            .linkTarget('target')
            .linkColor(link => {
                if (hoverNode) {
                    const isHovered = (link.source.id || link.source) === hoverNode.id || (link.target.id || link.target) === hoverNode.id;
                    if (!isHovered) return 'rgba(100, 100, 100, 0.05)';
                }
                return colorScale(link.type);
            })
            .linkWidth(link => {
                // Scale width gently based on weight (e.g. log scale)
                const baseWidth = Math.log(link.weight + 1) * 0.8 + 0.2;
                if (hoverNode) {
                    const isHovered = (link.source.id || link.source) === hoverNode.id || (link.target.id || link.target) === hoverNode.id;
                    if (isHovered) return baseWidth * 1.5; // Slightly thicker on hover
                }
                return baseWidth;
            });
            
        Graph.d3Force('charge').strength(-250);
        Graph.d3Force('link').distance(100);
            
        function updateGraph() {
            const checkedBoxes = Array.from(document.querySelectorAll('input[type="checkbox"]:checked')).map(cb => cb.value);
            const activeTypes = new Set(checkedBoxes);
            
            const filteredLinks = rawData.links.filter(l => activeTypes.has(l.type));
            
            const activeNodeIds = new Set();
            filteredLinks.forEach(l => {
                activeNodeIds.add(typeof l.source === 'object' ? l.source.id : l.source);
                activeNodeIds.add(typeof l.target === 'object' ? l.target.id : l.target);
            });
            
            const filteredNodes = rawData.nodes.filter(n => activeNodeIds.has(n.id));
            
            Graph.graphData({ nodes: filteredNodes, links: filteredLinks });
            
            document.getElementById('node-count').innerText = `Nodes: ${filteredNodes.length}`;
            document.getElementById('link-count').innerText = `Links: ${filteredLinks.length}`;
        }
        
        document.querySelectorAll('input[type="checkbox"]').forEach(cb => {
            cb.addEventListener('change', updateGraph);
        });
        
        updateGraph();
    </script>
</body>
</html>
